name: Codebase video Remotion render

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codebase-video-remotion-render.yml"
      - "render-jobs/current/**"

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Chinese fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          fc-cache -f

      - name: Read render job
        id: job
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path("render-jobs/current/render-job.json").read_text(encoding="utf-8"))
          allowed = [
              "project_path", "entrypoint", "composition", "output_name",
              "artifact_name", "preview_frame", "concurrency", "audio_run_id",
              "audio_artifact_name", "audio_artifact_file", "audio_target",
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key in allowed:
                  value = str(data.get(key, ""))
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Invalid newline in render-job field: {key}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Download narration artifact
        if: ${{ steps.job.outputs.audio_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.job.outputs.audio_artifact_name }}
          path: ${{ runner.temp }}/codebase-video-audio
          run-id: ${{ steps.job.outputs.audio_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install downloaded narration
        if: ${{ steps.job.outputs.audio_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.job.outputs.project_path }}/${{ steps.job.outputs.audio_target }}"
          mkdir -p "$(dirname "$target")"
          cp "${{ runner.temp }}/codebase-video-audio/${{ steps.job.outputs.audio_artifact_file }}" "$target"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$target"

      - name: Install Remotion dependencies
        working-directory: ${{ steps.job.outputs.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: ${{ steps.job.outputs.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          fi

      - name: Render preview still with Remotion
        working-directory: ${{ steps.job.outputs.project_path }}
        shell: bash
        run: |
          mkdir -p out
          npx remotion still \
            "${{ steps.job.outputs.entrypoint }}" \
            "${{ steps.job.outputs.composition }}" \
            out/preview.png \
            --frame="${{ steps.job.outputs.preview_frame }}"

      - name: Render full MP4 with Remotion
        working-directory: ${{ steps.job.outputs.project_path }}
        shell: bash
        run: |
          npx remotion render \
            "${{ steps.job.outputs.entrypoint }}" \
            "${{ steps.job.outputs.composition }}" \
            "out/${{ steps.job.outputs.output_name }}" \
            --codec=h264 \
            --pixel-format=yuv420p \
            --concurrency="${{ steps.job.outputs.concurrency }}"

      - name: Verify MP4
        working-directory: ${{ steps.job.outputs.project_path }}
        shell: bash
        run: |
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json \
            "out/${{ steps.job.outputs.output_name }}" | tee out/ffprobe.json

      - name: Upload Remotion render
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.job.outputs.artifact_name }}
          path: |
            ${{ steps.job.outputs.project_path }}/out/${{ steps.job.outputs.output_name }}
            ${{ steps.job.outputs.project_path }}/out/preview.png
            ${{ steps.job.outputs.project_path }}/out/ffprobe.json
          retention-days: 7
          if-no-files-found: error
