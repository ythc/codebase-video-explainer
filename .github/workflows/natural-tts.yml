name: Generate natural Chinese TTS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/natural-tts.yml"
      - "tts-jobs/warp-masque-natural/**"

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TTS dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "edge-tts==7.2.8"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Generate scene audio and exact sentence boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tts-output/raw tts-output/metadata tts-output/normalized

          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          import edge_tts

          data = json.loads(
              Path("tts-jobs/warp-masque-natural/scenes.json").read_text(encoding="utf-8")
          )
          voice = data.get("voice", "zh-CN-YunyangNeural")
          rate = data.get("rate", "-5%")
          pitch = data.get("pitch", "-2Hz")
          volume = data.get("volume", "+0%")

          async def main():
              for scene in data["scenes"]:
                  idx = int(scene["index"])
                  text = scene["text"].strip()
                  audio_path = Path("tts-output/raw") / f"{idx:02d}.mp3"
                  meta_path = Path("tts-output/metadata") / f"{idx:02d}.jsonl"

                  print(f"Synthesizing scene {idx}: {scene['title']}")
                  communicate = edge_tts.Communicate(
                      text=text,
                      voice=voice,
                      rate=rate,
                      volume=volume,
                      pitch=pitch,
                      boundary="SentenceBoundary",
                  )

                  with audio_path.open("wb") as audio, meta_path.open(
                      "w", encoding="utf-8"
                  ) as meta:
                      async for chunk in communicate.stream():
                          if chunk["type"] == "audio":
                              audio.write(chunk["data"])
                          elif chunk["type"] == "SentenceBoundary":
                              meta.write(json.dumps(chunk, ensure_ascii=False) + "\n")

          asyncio.run(main())
          PY

      - name: Normalize scene audio to PCM
        shell: bash
        run: |
          set -euo pipefail
          for f in tts-output/raw/*.mp3; do
            b=$(basename "$f" .mp3)
            ffmpeg -y -hide_banner -loglevel error -i "$f"               -af "loudnorm=I=-16:TP=-1.5:LRA=11"               -ar 48000 -ac 2 -c:a pcm_s16le               "tts-output/normalized/${b}.wav"
          done

      - name: Build exact subtitles, timing and final narration
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          root = Path("tts-output")
          data = json.loads(
              Path("tts-jobs/warp-masque-natural/scenes.json").read_text(encoding="utf-8")
          )
          gap = 0.70

          def duration(path: Path) -> float:
              return float(
                  subprocess.check_output(
                      [
                          "ffprobe", "-v", "error",
                          "-show_entries", "format=duration",
                          "-of", "default=noprint_wrappers=1:nokey=1",
                          str(path),
                      ],
                      text=True,
                  ).strip()
              )

          def srt_ts(seconds: float) -> str:
              ms = max(0, round(seconds * 1000))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          cursor = 0.0
          cue = 1
          srt = []
          timings = []

          for pos, scene in enumerate(data["scenes"]):
              idx = int(scene["index"])
              wav = root / "normalized" / f"{idx:02d}.wav"
              meta = root / "metadata" / f"{idx:02d}.jsonl"
              audio_duration = duration(wav)
              scene_start = cursor
              scene_end = scene_start + audio_duration

              timings.append(
                  {
                      "index": idx,
                      "title": scene["title"],
                      "start_seconds": round(scene_start, 3),
                      "duration_seconds": round(audio_duration, 3),
                      "end_seconds": round(scene_end, 3),
                  }
              )

              rows = [
                  json.loads(line)
                  for line in meta.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

              if not rows:
                  rows = [{
                      "offset": 0,
                      "duration": int(audio_duration * 10_000_000),
                      "text": scene["text"].strip(),
                  }]

              for row in rows:
                  local_start = row["offset"] / 10_000_000
                  local_end = (row["offset"] + row["duration"]) / 10_000_000
                  start = scene_start + local_start
                  end = min(scene_end, scene_start + local_end)
                  text = str(row.get("text", "")).strip()
                  if not text or end <= start:
                      continue
                  srt.extend([
                      str(cue),
                      f"{srt_ts(start)} --> {srt_ts(end)}",
                      text,
                      "",
                  ])
                  cue += 1

              cursor = scene_end + (gap if pos < len(data["scenes"]) - 1 else 0.0)

          (root / "timings.json").write_text(
              json.dumps(
                  {"scene_gap_seconds": gap, "total_seconds": round(cursor, 3), "scenes": timings},
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          (root / "subtitles.srt").write_text("\n".join(srt), encoding="utf-8")
          PY

          mkdir -p tts-output/padded
          count=$(find tts-output/normalized -name '*.wav' | wc -l)
          i=0
          for f in tts-output/normalized/*.wav; do
            b=$(basename "$f" .wav)
            i=$((i+1))
            if [ "$i" -lt "$count" ]; then
              ffmpeg -y -hide_banner -loglevel error                 -i "$f" -f lavfi -t 0.7 -i anullsrc=r=48000:cl=stereo                 -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[out]"                 -map "[out]" -ar 48000 -ac 2 -c:a pcm_s16le                 "tts-output/padded/${b}.wav"
            else
              cp "$f" "tts-output/padded/${b}.wav"
            fi
          done

          : > tts-output/concat.txt
          for f in tts-output/padded/*.wav; do
            printf "file '%s'\n" "$(realpath "$f")" >> tts-output/concat.txt
          done

          ffmpeg -y -hide_banner -loglevel error             -f concat -safe 0 -i tts-output/concat.txt             -ar 48000 -ac 2 -c:a pcm_s16le             tts-output/narration-natural.wav

          ffmpeg -y -hide_banner -loglevel error             -i tts-output/narration-natural.wav             -c:a libmp3lame -b:a 160k             tts-output/narration-natural.mp3

      - name: Verify subtitle timeline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path("tts-output/timings.json").read_text(encoding="utf-8"))
          srt = Path("tts-output/subtitles.srt").read_text(encoding="utf-8")
          print("total_seconds =", t["total_seconds"])
          print("subtitle_count =", srt.count(" --> "))
          print(srt[:1800])
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-natural-tts
          path: |
            tts-output/narration-natural.mp3
            tts-output/subtitles.srt
            tts-output/timings.json
            tts-output/metadata/*.jsonl
          retention-days: 7
          if-no-files-found: error
