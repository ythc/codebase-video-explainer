name: Codebase video natural TTS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codebase-video-natural-tts.yml"
      - "tts-jobs/current/**"

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Edge TTS and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install "edge-tts==7.2.8"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate scene audio and SentenceBoundary metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tts-output/raw tts-output/metadata tts-output/normalized
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          import edge_tts

          data = json.loads(Path("tts-jobs/current/scenes.json").read_text(encoding="utf-8"))
          voice = data.get("voice", "zh-CN-YunyangNeural")
          rate = data.get("rate", "-5%")
          pitch = data.get("pitch", "-2Hz")
          volume = data.get("volume", "+0%")

          async def main():
              for scene in data["scenes"]:
                  idx = int(scene["index"])
                  audio_path = Path("tts-output/raw") / f"{idx:02d}.mp3"
                  meta_path = Path("tts-output/metadata") / f"{idx:02d}.jsonl"
                  communicate = edge_tts.Communicate(
                      text=scene["text"].strip(),
                      voice=voice,
                      rate=rate,
                      pitch=pitch,
                      volume=volume,
                      boundary="SentenceBoundary",
                  )
                  with audio_path.open("wb") as audio, meta_path.open("w", encoding="utf-8") as meta:
                      async for chunk in communicate.stream():
                          if chunk["type"] == "audio":
                              audio.write(chunk["data"])
                          elif chunk["type"] == "SentenceBoundary":
                              meta.write(json.dumps(chunk, ensure_ascii=False) + "\n")

          asyncio.run(main())
          PY

      - name: Normalize scene audio
        shell: bash
        run: |
          set -euo pipefail
          for f in tts-output/raw/*.mp3; do
            b=$(basename "$f" .mp3)
            ffmpeg -y -hide_banner -loglevel error -i "$f" \
              -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
              -ar 48000 -ac 2 -c:a pcm_s16le \
              "tts-output/normalized/${b}.wav"
          done

      - name: Build exact subtitles and final narration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, wave
          from pathlib import Path

          root = Path("tts-output")
          data = json.loads(Path("tts-jobs/current/scenes.json").read_text(encoding="utf-8"))
          gap = 0.70
          ticks = 10_000_000

          def duration(path):
              return float(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", str(path)
              ], text=True).strip())

          def ts(seconds):
              ms = max(0, round(seconds * 1000))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          cursor = 0.0
          cue = 1
          srt = []
          timings = []
          scenes = data["scenes"]
          wav_out = root / "narration.wav"

          with wave.open(str(wav_out), "wb") as out:
              out.setnchannels(2)
              out.setsampwidth(2)
              out.setframerate(48000)

              for pos, scene in enumerate(scenes):
                  idx = int(scene["index"])
                  wav = root / "normalized" / f"{idx:02d}.wav"
                  meta = root / "metadata" / f"{idx:02d}.jsonl"
                  d = duration(wav)
                  start = cursor
                  speech_end = start + d
                  gap_after = gap if pos < len(scenes) - 1 else 0.0

                  rows = [json.loads(line) for line in meta.read_text(encoding="utf-8").splitlines() if line.strip()]
                  if not rows:
                      rows = [{"offset": 0, "duration": int(d * ticks), "text": scene["text"]}]

                  for row in rows:
                      s = start + row["offset"] / ticks
                      e = min(speech_end, start + (row["offset"] + row["duration"]) / ticks)
                      text = str(row.get("text", "")).strip()
                      if text and e > s:
                          srt.extend([str(cue), f"{ts(s)} --> {ts(e)}", text, ""])
                          cue += 1

                  timings.append({
                      "index": idx,
                      "id": scene.get("id", str(idx)),
                      "title": scene.get("title", ""),
                      "start_seconds": round(start, 3),
                      "speech_duration_seconds": round(d, 3),
                      "gap_after_seconds": gap_after,
                      "end_seconds": round(speech_end + gap_after, 3),
                  })

                  with wave.open(str(wav), "rb") as src:
                      out.writeframes(src.readframes(src.getnframes()))
                  if gap_after:
                      out.writeframes(b"\x00\x00\x00\x00" * round(gap_after * 48000))
                  cursor = speech_end + gap_after

          (root / "subtitles.srt").write_text("\n".join(srt), encoding="utf-8")
          (root / "timings.json").write_text(json.dumps({
              "voice": data.get("voice", "zh-CN-YunyangNeural"),
              "scene_gap_seconds": gap,
              "total_seconds": round(cursor, 3),
              "scenes": timings,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          ffmpeg -y -hide_banner -loglevel error \
            -i tts-output/narration.wav -c:a libmp3lame -b:a 160k \
            tts-output/narration.mp3

      - name: Upload TTS artifact
        uses: actions/upload-artifact@v6
        with:
          name: codebase-video-natural-tts
          path: |
            tts-output/narration.mp3
            tts-output/subtitles.srt
            tts-output/timings.json
            tts-output/metadata/*.jsonl
          retention-days: 7
          if-no-files-found: error
