name: Render clean homepage video

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/homepage-video-remotion.yml"
      - "render-jobs/current/**"

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Chinese fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          fc-cache -f

      - name: Read render job
        id: job
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("render-jobs/current/render-job.json").read_text(encoding="utf-8"))
          for key in ["project_path","entrypoint","composition","output_name","artifact_name","preview_frame","concurrency","audio_run_id","audio_artifact_name","audio_artifact_file","audio_target"]:
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
                  f.write(f"{key}={data.get(key,'')}\n")
          PY

      - name: Download narration
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.job.outputs.audio_artifact_name }}
          path: ${{ runner.temp }}/voice
          run-id: ${{ steps.job.outputs.audio_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install narration
        shell: bash
        run: |
          target="${{ steps.job.outputs.project_path }}/${{ steps.job.outputs.audio_target }}"
          mkdir -p "$(dirname "$target")"
          cp "${{ runner.temp }}/voice/${{ steps.job.outputs.audio_artifact_file }}" "$target"

      - name: Install dependencies
        working-directory: ${{ steps.job.outputs.project_path }}
        run: npm install

      - name: Typecheck
        working-directory: ${{ steps.job.outputs.project_path }}
        run: npx tsc --noEmit

      - name: Render preview
        working-directory: ${{ steps.job.outputs.project_path }}
        run: |
          mkdir -p out
          npx remotion still "${{ steps.job.outputs.entrypoint }}" "${{ steps.job.outputs.composition }}" out/preview.png --frame="${{ steps.job.outputs.preview_frame }}"

      - name: Render MP4
        working-directory: ${{ steps.job.outputs.project_path }}
        run: |
          npx remotion render "${{ steps.job.outputs.entrypoint }}" "${{ steps.job.outputs.composition }}" "out/${{ steps.job.outputs.output_name }}" --codec=h264 --pixel-format=yuv420p --concurrency="${{ steps.job.outputs.concurrency }}"

      - name: Verify
        working-directory: ${{ steps.job.outputs.project_path }}
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "out/${{ steps.job.outputs.output_name }}" | tee out/ffprobe.json

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.job.outputs.artifact_name }}
          path: |
            ${{ steps.job.outputs.project_path }}/out/${{ steps.job.outputs.output_name }}
            ${{ steps.job.outputs.project_path }}/out/preview.png
            ${{ steps.job.outputs.project_path }}/out/ffprobe.json
          retention-days: 7
          if-no-files-found: error

      - name: Publish homepage media
        shell: bash
        run: |
          mkdir -p docs/media
          cp "${{ steps.job.outputs.project_path }}/out/${{ steps.job.outputs.output_name }}" docs/media/codebase-video-explainer-demo.mp4
          cp "${{ steps.job.outputs.project_path }}/out/preview.png" docs/media/codebase-video-explainer-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/codebase-video-explainer-demo.mp4 docs/media/codebase-video-explainer-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish product-focused explainer video"
            git push
          fi
